aid: beep
name: Beep
description: >-
  Beep (Just Beep It!) is a visual feedback and web collaboration platform that
  helps teams review live websites, report bugs, run user testing, and collect
  ideas directly on the page. Delivered primarily as a browser extension, it lets
  users annotate any web page, leave comments, attach files, and record their
  screen so feedback moves faster and projects ship sooner. The product targets
  agencies, product teams, and builders, offers a free tier plus a paid
  SuperBeeper plan and enterprise pricing, and is built on Wix. It exposes no
  bespoke developer REST API, but its Wix-powered site publishes an llms.txt and
  a public Wix Site MCP endpoint for agentic AI access. Surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network.
